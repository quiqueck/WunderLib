apply from: "common-fabric-project.gradle"

javadoc {
    options {
        source = "25"
        encoding = "UTF-8"
        charSet = "UTF-8"
        memberLevel = JavadocMemberLevel.PROTECTED
        links("https://docs.oracle.com/en/java/javase/17/docs/api/")
        // Disable the crazy super-strict doclint tool in Java 8
        addStringOption("Xdoclint:none", "-quiet")
        addStringOption("noqualifier", "net.minecraft.*:com.mojang.*:net.fabricmc.*")
        addBooleanOption("-allow-script-in-comments", true)
        tags(
                'apiNote:a:API Note:',
                'implSpec:a:Implementation Requirements:',
                'implNote:a:Implementation Note:'
        )
    }


    allprojects.each {
        source(it.sourceSets.main.allJava)
        source(it.sourceSets.client.allJava)
    }

    classpath = files(
            sourceSets.main.compileClasspath, sourceSets.main.runtimeClasspath,
            sourceSets.client.compileClasspath, sourceSets.client.runtimeClasspath
    )
    include("**/api/**")
    include("de/ambertation/**")
    failOnError = true
}

// Exposes the jar to sibling projects that include this library the old way
// (project(path: ':wunderlib', configuration: 'dev')), e.g. BCLib's
// bclib.gradle on other Minecraft versions. Keep until nothing needs it.
configurations {
    dev {
        canBeResolved = false
        canBeConsumed = true
    }
}

task javadocJar(type: Jar, dependsOn: [javadoc]) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    dev jar
}

tasks.assemble.dependsOn(sourcesJar, javadocJar)
