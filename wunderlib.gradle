apply from: "common-fabric-project.gradle"

sourceSets {
    main {
        java {
            srcDirs += ['src/client/java', 'src/datagen/java']
        }
    }
}

javadoc {
    options {
        source = "21"
        encoding = "UTF-8"
        charSet = "UTF-8"
        memberLevel = JavadocMemberLevel.PROTECTED
        links("https://docs.oracle.com/en/java/javase/17/docs/api/")
        // Disable the crazy super-strict doclint tool in Java 8
        addStringOption("Xdoclint:none", "-quiet")
        addStringOption("noqualifier", "net.minecraft.*:com.mojang.*:net.fabricmc.*")
        addBooleanOption("-allow-script-in-comments", true)
        tags(
                'apiNote:a:API Note:',
                'implSpec:a:Implementation Requirements:',
                'implNote:a:Implementation Note:'
        )
    }


    allprojects.each {
        source(it.sourceSets.main.allJava)
    }

    classpath = files(sourceSets.main.compileClasspath, sourceSets.main.runtimeClasspath)
    include("**/api/**")
    include("de/ambertation/**")
    failOnError true
}

// Exposes the remapped jar to sibling projects that still include this
// library the old way (project(path: ':wunderlib', configuration: 'dev')),
// e.g. BCLib's bclib.gradle. Keep until those repos migrate to includeBuild.
configurations {
    dev {
        canBeResolved = false
        canBeConsumed = true
    }
}

task javadocJar(type: Jar, dependsOn: [javadoc]) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    dev jar
    archives sourcesJar
    archives javadocJar
}
