plugins {
    id 'idea'
    id 'eclipse'
    id 'fabric-loom'
    id 'maven-publish'
}
java {
    withSourcesJar()
}
sourceSets {
    main {
        java {
            srcDirs += ['src/client/java', 'src/datagen/java']
        }
    }
}

tasks.sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

apply from: "wunderlib.gradle"